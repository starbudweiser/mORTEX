<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>mORTEX</title>
        <style>
            /* Écran de lancement animé : logo en 3D (pales en tourbillon, cube qui se pose) et titre */
            :root {
                --orange-1: #ffc15a;
                --orange-2: #ff5e0a;
                --text: #ffffff;
                --muted: #aaaaaa;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
                -webkit-user-select: none;
                user-select: none;
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            }

            .stage {
                position: absolute;
                inset: 12px;
                perspective: 900px;
            }

            .card {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                gap: 26px;
                padding: 0 30px 0 34px;
                border-radius: 16px;
                overflow: hidden;
                background: linear-gradient(160deg, #34363d 0%, #1b1c21 55%, #121317 100%);
                box-shadow:
                    0 0 0 1px rgb(255 255 255 / 8%) inset,
                    0 10px 24px rgb(0 0 0 / 45%);
                transform-style: preserve-3d;
                animation: card-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* Lueur orange derrière le logo */
            .card::before {
                content: "";
                position: absolute;
                left: -40px;
                top: 50%;
                width: 240px;
                height: 240px;
                margin-top: -120px;
                background: radial-gradient(circle, rgb(255 120 30 / 22%), transparent 65%);
                opacity: 0;
                animation: glow 1.4s 300ms ease-out forwards;
            }

            /* Reflet qui balaie la carte */
            .card::after {
                content: "";
                position: absolute;
                top: -50%;
                left: -60%;
                width: 40%;
                height: 200%;
                background: linear-gradient(
                    100deg,
                    transparent,
                    rgb(255 255 255 / 10%) 45%,
                    rgb(255 255 255 / 18%) 50%,
                    rgb(255 255 255 / 10%) 55%,
                    transparent
                );
                transform: rotate(8deg) translateX(0);
                animation: sheen 1.1s 1.35s ease-in-out forwards;
            }

            /* ---- Logo ---- */
            .logo {
                position: relative;
                flex: 0 0 auto;
                width: 108px;
                height: 108px;
                transform-style: preserve-3d;
            }

            .blades {
                position: absolute;
                inset: 0;
                width: 108px;
                height: 108px;
                overflow: visible;
                filter: drop-shadow(0 0 6px rgb(255 110 20 / 45%));
                animation:
                    blades-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) both,
                    blades-idle 9s 1.3s linear infinite,
                    heartbeat 1.2s 1.3s ease-in-out infinite;
            }

            .cube-wrap {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 0;
                height: 0;
                perspective: 500px;
                /* le fondu est ici : une opacité animée sur le cube lui-même l'aplatirait */
                animation: fade-in 450ms 150ms ease-out both;
            }

            .cube {
                --s: 26px;
                position: absolute;
                left: calc(var(--s) / -2);
                top: calc(var(--s) / -2);
                width: var(--s);
                height: var(--s);
                transform-style: preserve-3d;
                animation:
                    cube-in 1.5s 150ms cubic-bezier(0.34, 1.3, 0.5, 1) both,
                    cube-idle 6s 1.65s ease-in-out infinite;
            }

            .face {
                position: absolute;
                inset: 0;
                backface-visibility: hidden;
            }

            /* Teintes du cube de l'icône : dessus blanc, gauche gris clair, droite gris */
            .f-top {
                background: #ffffff;
                transform: rotateX(90deg) translateZ(calc(var(--s) / 2));
            }
            .f-bottom {
                background: #6e737d;
                transform: rotateX(-90deg) translateZ(calc(var(--s) / 2));
            }
            .f-front {
                background: #d6d9df;
                transform: translateZ(calc(var(--s) / 2));
            }
            .f-back {
                background: #9aa0ab;
                transform: rotateY(180deg) translateZ(calc(var(--s) / 2));
            }
            .f-right {
                background: #9aa0ab;
                transform: rotateY(90deg) translateZ(calc(var(--s) / 2));
            }
            .f-left {
                background: #d6d9df;
                transform: rotateY(-90deg) translateZ(calc(var(--s) / 2));
            }

            /* ---- Titre ---- */
            .text {
                position: relative;
                flex: 1 1 auto;
                min-width: 0;
                transform-style: preserve-3d;
            }

            .title {
                display: flex;
                margin: 0;
                font-size: 50px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 0.5px;
                color: var(--text);
                perspective: 400px;
            }

            .title span {
                display: inline-block;
                transform-origin: 50% 85%;
                animation: letter-in 700ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
                animation-delay: calc(450ms + var(--i) * 70ms);
            }

            .title .m {
                background: linear-gradient(135deg, var(--orange-1), var(--orange-2));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .rule {
                height: 2px;
                margin: 10px 0 9px;
                border-radius: 1px;
                background: linear-gradient(
                    90deg,
                    var(--orange-1),
                    var(--orange-2) 60%,
                    transparent
                );
                transform-origin: left center;
                animation: rule-in 700ms 950ms cubic-bezier(0.65, 0, 0.35, 1) both;
            }

            .subtitle {
                margin: 0;
                font-size: 17px;
                font-weight: 600;
                letter-spacing: 5px;
                color: #d8d8d8;
                white-space: nowrap;
                animation: subtitle-in 900ms 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .footer {
                position: absolute;
                right: 18px;
                bottom: 10px;
                font-size: 9.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                color: var(--muted);
                text-transform: uppercase;
                animation: fade-in 600ms 1.5s ease-out both;
            }

            /* Sortie : la carte avance vers l'écran en se floutant */
            body.leaving .stage {
                transition:
                    opacity 450ms ease-in,
                    transform 450ms ease-in,
                    filter 450ms ease-in;
                opacity: 0;
                transform: scale(1.08) translateZ(0);
                filter: blur(6px);
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: rotateX(28deg) rotateY(-14deg) translateZ(-120px) scale(0.92);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes glow {
                to {
                    opacity: 1;
                }
            }

            @keyframes sheen {
                to {
                    transform: rotate(8deg) translateX(520%);
                }
            }

            @keyframes blades-in {
                from {
                    opacity: 0;
                    transform: rotate(-420deg) scale(0.2);
                }
                40% {
                    opacity: 1;
                }
                to {
                    opacity: 1;
                    transform: rotate(0deg) scale(1);
                }
            }

            /* Battement de cœur : double pulsation, puis repos. Propriété « scale » séparée,
               elle se compose avec la rotation de « transform » sans l'interrompre */
            @keyframes heartbeat {
                0%,
                100% {
                    scale: 1;
                }
                14% {
                    scale: 1.1;
                }
                28% {
                    scale: 0.97;
                }
                42% {
                    scale: 1.06;
                }
                60% {
                    scale: 1;
                }
            }

            @keyframes blades-idle {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Arrivée en culbute, puis pose sur la vue isométrique de l'icône */
            @keyframes cube-in {
                from {
                    transform: translateZ(-160px) rotateX(200deg) rotateY(-260deg) scale(0.3);
                }
                to {
                    transform: rotateX(-35.26deg) rotateY(45deg) scale(1);
                }
            }

            @keyframes cube-idle {
                0%,
                100% {
                    transform: rotateX(-35.26deg) rotateY(45deg);
                }
                50% {
                    transform: rotateX(-30deg) rotateY(80deg) translateY(-2px);
                }
            }

            @keyframes letter-in {
                from {
                    opacity: 0;
                    transform: rotateX(-95deg) translateY(14px);
                    filter: blur(3px);
                }
                to {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
            }

            @keyframes rule-in {
                from {
                    transform: scaleX(0);
                }
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes subtitle-in {
                from {
                    opacity: 0;
                    letter-spacing: 14px;
                    filter: blur(4px);
                }
                to {
                    opacity: 1;
                    letter-spacing: 5px;
                    filter: none;
                }
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 1ms !important;
                    animation-delay: 0ms !important;
                    animation-iteration-count: 1 !important;
                }
            }
        </style>
    </head>

    <body id="bg">
        <div class="stage">
            <div class="card">
                <div class="logo">
                    <svg class="blades" viewBox="36 36 184 184" aria-hidden="true">
                        <defs>
                            <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#ffc15a" />
                                <stop offset="1" stop-color="#ff5e0a" />
                            </linearGradient>
                            <path
                                id="blade"
                                d="M128 50 A78 78 0 0 1 206 128 A56 56 0 0 0 128 50 Z"
                            />
                        </defs>
                        <g fill="url(#arm)">
                            <use href="#blade" />
                            <use href="#blade" transform="rotate(120 128 128)" />
                            <use href="#blade" transform="rotate(240 128 128)" />
                        </g>
                    </svg>

                    <div class="cube-wrap">
                        <div class="cube">
                            <div class="face f-top"></div>
                            <div class="face f-bottom"></div>
                            <div class="face f-front"></div>
                            <div class="face f-back"></div>
                            <div class="face f-right"></div>
                            <div class="face f-left"></div>
                        </div>
                    </div>
                </div>

                <div class="text">
                    <h1 class="title" aria-label="mORTEX">
                        <span class="m" style="--i: 0">m</span>
                        <span style="--i: 1">O</span>
                        <span style="--i: 2">R</span>
                        <span style="--i: 3">T</span>
                        <span style="--i: 4">E</span>
                        <span style="--i: 5">X</span>
                    </h1>
                    <div class="rule"></div>
                    <p class="subtitle">MODS MANAGER</p>
                </div>

                <div class="footer" id="footer"></div>
            </div>
        </div>

        <script>
            require("./splash.js");
        </script>
    </body>
</html>
