<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>mORTEX</title>
        <style>
            /* Écran de lancement animé (règle Socle « Splash animé ») : les pales tournoient, le cube
               se pose, puis le titre ; à plat, sans ombre, halo, reflet, flou ni dégradé superflu */
            :root {
                --orange: #f59e0b;
                --text: #ffffff;
                --muted: #aaaaaa;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
                -webkit-user-select: none;
                user-select: none;
                cursor: default;
                font-family:
                    -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            }

            /* fenêtre de 500 × 190 (Socle size-splash-*) : carte de 476 × 166 et marge de 12 px */
            .stage {
                position: absolute;
                inset: 12px;
                perspective: 900px;
            }

            .card {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 22px;
                /* marge identique des deux côtés (Socle space-6) */
                padding: 0 24px;
                border-radius: 16px;
                background: #1b1c21;
                border: 1px solid rgb(255 255 255 / 8%);
                animation: card-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* ---- Logo ---- */
            .logo {
                position: relative;
                flex: 0 0 auto;
                width: 108px;
                height: 108px;
                /* pas de preserve-3d : pales et cube restent chacun dans leur plan, sans se couper */
            }

            .blades {
                position: absolute;
                inset: 0;
                width: 108px;
                height: 108px;
                overflow: visible;
                animation: blades-in 1.3s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            .cube-wrap {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 0;
                height: 0;
                perspective: 500px;
                /* le fondu est ici : une opacité animée sur le cube lui-même l'aplatirait */
                animation: fade-in 450ms 150ms ease-out both;
            }

            .cube {
                --s: 26px;
                position: absolute;
                left: calc(var(--s) / -2);
                top: calc(var(--s) / -2);
                width: var(--s);
                height: var(--s);
                transform-style: preserve-3d;
                animation: cube-in 1.5s 150ms cubic-bezier(0.34, 1.3, 0.5, 1) both;
            }

            .face {
                position: absolute;
                inset: 0;
                backface-visibility: hidden;
            }

            /* Teintes du cube de l'icône : dessus blanc, gauche gris clair, droite gris */
            .f-top {
                background: #ffffff;
                transform: rotateX(90deg) translateZ(calc(var(--s) / 2));
            }
            .f-bottom {
                background: #6e737d;
                transform: rotateX(-90deg) translateZ(calc(var(--s) / 2));
            }
            .f-front {
                background: #d6d9df;
                transform: translateZ(calc(var(--s) / 2));
            }
            .f-back {
                background: #9aa0ab;
                transform: rotateY(180deg) translateZ(calc(var(--s) / 2));
            }
            .f-right {
                background: #9aa0ab;
                transform: rotateY(90deg) translateZ(calc(var(--s) / 2));
            }
            .f-left {
                background: #d6d9df;
                transform: rotateY(-90deg) translateZ(calc(var(--s) / 2));
            }

            /* ---- Titre ---- */
            .text {
                position: relative;
                flex: 0 1 auto;
                min-width: 0;
            }

            .title {
                display: flex;
                margin: 0;
                /* taille fixe commune aux splashs (Socle size-splash-title) */
                font-size: 40px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 0.5px;
                color: var(--text);
                perspective: 400px;
            }

            .title span {
                display: inline-block;
                transform-origin: 50% 85%;
                animation: letter-in 700ms cubic-bezier(0.2, 1.2, 0.4, 1) both;
                animation-delay: calc(450ms + var(--i) * 70ms);
            }

            .title .m {
                color: var(--orange);
            }

            .rule {
                height: 2px;
                margin: 10px 0 9px;
                border-radius: 1px;
                background: var(--orange);
                transform-origin: left center;
                animation: rule-in 700ms 950ms cubic-bezier(0.65, 0, 0.35, 1) both;
            }

            .subtitle {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 3.5px;
                color: #d8d8d8;
                white-space: nowrap;
                animation: subtitle-in 900ms 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            .footer {
                position: absolute;
                right: 24px;
                bottom: 10px;
                font-size: 9.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                color: var(--muted);
                text-transform: uppercase;
                animation: fade-in 600ms 1.5s ease-out both;
            }

            /* Sortie : zoom arrière avec léger rebond, limité à 104 % pour rester dans la fenêtre */
            body.leaving .stage {
                animation: leave 600ms cubic-bezier(0.6, -0.15, 0.735, 0.045) forwards;
            }

            @keyframes leave {
                from {
                    opacity: 1;
                    transform: scale(1);
                }
                70% {
                    opacity: 1;
                }
                to {
                    opacity: 0;
                    transform: scale(0.05);
                }
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: rotateX(28deg) rotateY(-14deg) translateZ(-120px) scale(0.92);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes blades-in {
                from {
                    opacity: 0;
                    transform: rotate(-420deg) scale(0.2);
                }
                40% {
                    opacity: 1;
                }
                to {
                    opacity: 1;
                    transform: rotate(0deg) scale(1);
                }
            }

            /* Arrivée en culbute, puis pose sur la vue isométrique de l'icône */
            @keyframes cube-in {
                from {
                    transform: translateZ(-160px) rotateX(200deg) rotateY(-260deg) scale(0.3);
                }
                to {
                    transform: rotateX(-35.26deg) rotateY(45deg) scale(1);
                }
            }

            @keyframes letter-in {
                from {
                    opacity: 0;
                    transform: rotateX(-95deg) translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            @keyframes rule-in {
                from {
                    transform: scaleX(0);
                }
                to {
                    transform: scaleX(1);
                }
            }

            @keyframes subtitle-in {
                from {
                    opacity: 0;
                    letter-spacing: 10px;
                }
                to {
                    opacity: 1;
                    letter-spacing: 3.5px;
                }
            }

            @keyframes fade-in {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            body.measure * {
                animation: none !important;
            }

            /* Splash fixe : tout est posé d'emblée et reste jusqu'à la fermeture, mêmes durées */
            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation: none !important;
                }
            }
        </style>
    </head>

    <body id="bg">
        <div class="stage">
            <div class="card">
                <div class="logo">
                    <svg class="blades" viewBox="36 36 184 184" aria-hidden="true">
                        <defs>
                            <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#ffc15a" />
                                <stop offset="1" stop-color="#ff5e0a" />
                            </linearGradient>
                            <path
                                id="blade"
                                d="M128 50 A78 78 0 0 1 206 128 A56 56 0 0 0 128 50 Z"
                            />
                        </defs>
                        <g fill="url(#arm)">
                            <use href="#blade" />
                            <use href="#blade" transform="rotate(120 128 128)" />
                            <use href="#blade" transform="rotate(240 128 128)" />
                        </g>
                    </svg>

                    <div class="cube-wrap">
                        <div class="cube">
                            <div class="face f-top"></div>
                            <div class="face f-bottom"></div>
                            <div class="face f-front"></div>
                            <div class="face f-back"></div>
                            <div class="face f-right"></div>
                            <div class="face f-left"></div>
                        </div>
                    </div>
                </div>

                <div class="text">
                    <h1 class="title" aria-label="mORTEX">
                        <span class="m" style="--i: 0">m</span>
                        <span style="--i: 1">O</span>
                        <span style="--i: 2">R</span>
                        <span style="--i: 3">T</span>
                        <span style="--i: 4">E</span>
                        <span style="--i: 5">X</span>
                    </h1>
                    <div class="rule"></div>
                    <p class="subtitle" id="subtitle"></p>
                </div>

                <div class="footer" id="footer"></div>
            </div>
        </div>

        <script>
            require("./splash.js");
        </script>
    </body>
</html>
